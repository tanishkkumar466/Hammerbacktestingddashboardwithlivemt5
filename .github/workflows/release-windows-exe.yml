# Build full Windows one-file exe and attach ONLY to the GitHub Release for this tag.
# Real exe is ~150–450 MB. If you see ~300 KB on the release, that is the source .zip — not the exe.

name: Release Windows EXE

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Verify runtime imports (must pass before PyInstaller)
        shell: pwsh
        run: |
          python -c @"
          import sqlite3, _sqlite3
          import PySide6, shiboken6
          import polars, numpy, matplotlib, PIL, openpyxl, psutil
          import ray
          print('sqlite3', sqlite3.sqlite_version)
          print('ray', ray.__version__)
          "@
          python -c "import MetaTrader5; print('MetaTrader5 OK')"

      - name: Build one-file executable
        run: pyinstaller --noconfirm --clean HammerCandleBacktestDashboard.spec

      - name: Verify EXE size (full build ~380–450 MB with ray + MT5 + Qt)
        shell: pwsh
        run: |
          $exe = "dist/HammerCandleBacktestDashboard.exe"
          if (-not (Test-Path $exe)) { throw "Build did not produce $exe" }
          $size = (Get-Item $exe).Length
          $mb = [math]::Round($size / 1MB, 1)
          Write-Host "Built $exe ($mb MB, $size bytes)"
          if ($size -lt 350MB) {
            throw "EXE too small ($mb MB) — expected ~380-450 MB with ray, MT5, PySide6, polars."
          }
          if ($size -lt 380MB) {
            Write-Warning "EXE is $mb MB (expected closer to 420 MB). Check PyInstaller bundle."
          }

      - name: Upload EXE to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/HammerCandleBacktestDashboard.exe
          fail_on_unmatched_files: true
          generate_release_notes: false
