# Build full Windows one-file exe and attach ONLY to the GitHub Release for this tag.
# Real exe is ~150–450 MB. If you see ~300 KB on the release, that is the source .zip — not the exe.

name: Release Windows EXE

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          # Never leave AVX-default polars installed alongside LTS (same import name).
          pip uninstall -y polars polars-lts-cpu 2>nul || true
          pip install -r requirements-build.txt
          pip uninstall -y polars 2>nul || true
          pip show polars-lts-cpu

      - name: Assert PyInstaller matches known-good local (6.19.0)
        shell: pwsh
        run: |
          python -c "import PyInstaller; v=PyInstaller.__version__; print('PyInstaller', v); assert v=='6.19.0', f'expected 6.19.0 got {v}'"

      - name: Verify Python syntax
        run: python scripts/verify_syntax.py

      - name: Verify runtime imports (must pass before PyInstaller)
        shell: pwsh
        run: |
          python -c @"
          import sqlite3, _sqlite3, ssl
          import PySide6, shiboken6
          import polars, pyarrow, numpy, matplotlib, PIL, openpyxl, psutil
          # Prove we built with LTS CPU wheel (not AVX-default polars)
          import polars as pl
          print('polars', pl.__version__, getattr(pl, '__package__', 'polars'))
          import matplotlib.backends.backend_qtagg, matplotlib.backends.backend_qt
          import et_xmlfile, defusedxml, tzdata
          import ray
          import ray._private.object_ref_generator
          import aiohttp, pydantic, pydantic_core, virtualenv, watchfiles, colorful
          print('sqlite3', sqlite3.sqlite_version)
          print('ray', ray.__version__)
          "@
          python -c "import MetaTrader5; print('MetaTrader5 OK')"
          python -c "import importlib.metadata as m; dists=[d.metadata['Name'] for d in m.distributions() if d.metadata['Name'].lower().replace('_','-') in ('polars','polars-lts-cpu')]; print('polars dists:', dists); assert 'polars-lts-cpu' in [x.lower() for x in dists] or any('lts' in x.lower() for x in dists), dists"

      - name: Build one-file executable
        run: pyinstaller --noconfirm --clean HammerCandleBacktestDashboard.spec

      - name: Verify EXE size (full build ~400–450 MB)
        shell: pwsh
        run: |
          $exe = "dist/HammerCandleBacktestDashboard.exe"
          if (-not (Test-Path $exe)) { throw "Build did not produce $exe" }
          $size = (Get-Item $exe).Length
          $mb = [math]::Round($size / 1MB, 1)
          Write-Host "Built $exe ($mb MB, $size bytes)"
          if ($size -lt 400MB) {
            throw "EXE too small ($mb MB) — expected ~420-450 MB with full ray[default] bundle."
          }
          if ($size -lt 420MB) {
            Write-Warning "EXE is $mb MB (target ~430 MB). Check ray[default] deps in requirements-build.txt."
          }

      - name: Smoke-test EXE starts (boot log)
        shell: pwsh
        run: |
          # Wait until log contains "QApplication OK" — do NOT stop when the file first appears
          # (runtime hook writes hammer_boot.log immediately; killing then hid the real hang).
          $work = Join-Path $env:RUNNER_TEMP "hammer_smoke"
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Copy-Item "dist/HammerCandleBacktestDashboard.exe" $work
          Unblock-File -LiteralPath (Join-Path $work "HammerCandleBacktestDashboard.exe") -ErrorAction SilentlyContinue
          Push-Location $work
          $sys32 = Join-Path $env:SystemRoot "System32"
          $env:PATH = "$sys32;$env:SystemRoot"
          Remove-Item Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          $proc = Start-Process -FilePath ".\HammerCandleBacktestDashboard.exe" -PassThru -WindowStyle Normal
          $deadline = (Get-Date).AddSeconds(90)
          $boot = ""
          $crash = ""
          while ((Get-Date) -lt $deadline) {
            if (Test-Path "hammer_boot.log") { $boot = Get-Content "hammer_boot.log" -Raw -ErrorAction SilentlyContinue }
            if (Test-Path "hammer_crash.log") { $crash = Get-Content "hammer_crash.log" -Raw -ErrorAction SilentlyContinue }
            if ($boot -match "QApplication OK") { break }
            if ($crash -and $crash.Trim().Length -gt 0) { break }
            if ($proc.HasExited -and $proc.ExitCode -ne 0) { break }
            Start-Sleep -Seconds 2
          }
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          if (Test-Path "hammer_boot.log") { $boot = Get-Content "hammer_boot.log" -Raw }
          if (Test-Path "hammer_crash.log") { $crash = Get-Content "hammer_crash.log" -Raw }
          Write-Host "==== hammer_boot.log ===="
          if ($boot) { Write-Host $boot } else { Write-Host "(missing)" }
          Write-Host "==== hammer_crash.log ===="
          if ($crash) { Write-Host $crash } else { Write-Host "(none)" }
          Pop-Location
          if ($crash -and $crash.Trim().Length -gt 0) { throw "EXE wrote hammer_crash.log — will not open on user PCs:`n$crash" }
          if (-not $boot) {
            throw "EXE never wrote hammer_boot.log — bootloader died before Python (DLL/OpenSSL)."
          }
          if ($boot -notmatch "QApplication OK") {
            throw "hammer_boot.log missing QApplication OK — real qwindows path failed:`n$boot"
          }
          Write-Host "Smoke OK — real qwindows platform + QApplication works (minimal PATH)."

      - name: Upload EXE to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/HammerCandleBacktestDashboard.exe
          fail_on_unmatched_files: true
          generate_release_notes: false
