# Build stub launcher + HammerRuntime, smoke-test, attach to the GitHub Release for this tag.
# Prefer Hammer-stub-package.zip (stub + app/HammerRuntime.exe). Also upload bridge EXEs
# for older clients. Do NOT upload Hammer-windows.zip: 1.0.27/1.0.28 exact-match it and crash.

name: Release Windows EXE

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          # Never leave AVX-default polars installed alongside LTS (same import name).
          pip uninstall -y polars polars-lts-cpu 2>nul || true
          pip install -r requirements-build.txt
          pip uninstall -y polars 2>nul || true
          pip show polars-lts-cpu
          pip install pytest

      - name: Assert PyInstaller matches known-good local (6.19.0)
        shell: pwsh
        run: |
          python -c "import PyInstaller; v=PyInstaller.__version__; print('PyInstaller', v); assert v=='6.19.0', f'expected 6.19.0 got {v}'"

      - name: Verify Python syntax
        run: python scripts/verify_syntax.py

      - name: Pipeline sanity (stub package / asset pick / no Qt in stub)
        run: python scripts/check_update_pipeline.py

      - name: Unit tests (updater + paths)
        run: python -m pytest tests/test_updater.py tests/test_logs_layout.py -q --tb=short

      - name: Verify runtime imports (must pass before PyInstaller)
        shell: pwsh
        run: |
          python -c @"
          import sqlite3, _sqlite3, ssl
          import PySide6, shiboken6
          import polars, pyarrow, numpy, matplotlib, PIL, openpyxl, psutil
          # Prove we built with LTS CPU wheel (not AVX-default polars)
          import polars as pl
          print('polars', pl.__version__, getattr(pl, '__package__', 'polars'))
          import matplotlib.backends.backend_qtagg, matplotlib.backends.backend_qt
          import et_xmlfile, defusedxml, tzdata
          import ray
          import ray._private.object_ref_generator
          import aiohttp, pydantic, pydantic_core, virtualenv, watchfiles, colorful
          print('sqlite3', sqlite3.sqlite_version)
          print('ray', ray.__version__)
          import update.paths, update.stub, update.updater as updater
          print('stub helpers OK', updater.CURRENT_VERSION)
          import update.migrate
          print('migrate helpers OK')
          "@
          python -c "import MetaTrader5; print('MetaTrader5 OK')"
          python -c "import importlib.metadata as m; dists=[d.metadata['Name'] for d in m.distributions() if d.metadata['Name'].lower().replace('_','-') in ('polars','polars-lts-cpu')]; print('polars dists:', dists); assert 'polars-lts-cpu' in [x.lower() for x in dists] or any('lts' in x.lower() for x in dists), dists"

      # Stub first so a later --clean runtime build cannot overwrite the launcher name by mistake
      - name: Build stub launcher (HammerCandleBacktestDashboard.exe)
        run: pyinstaller --noconfirm --clean HammerStub.spec

      - name: Stash stub aside
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/HammerCandleBacktestDashboard.exe")) { throw "Stub build missing" }
          New-Item -ItemType Directory -Force -Path "dist/_stash" | Out-Null
          Copy-Item "dist/HammerCandleBacktestDashboard.exe" "dist/_stash/HammerCandleBacktestDashboard.exe" -Force
          $sz = (Get-Item "dist/_stash/HammerCandleBacktestDashboard.exe").Length
          Write-Host "Stashed stub $sz bytes"
          if ($sz -ge 80MB) { throw "Stashed stub is too large - wrong binary" }

      - name: Build runtime (HammerRuntime.exe)
        run: pyinstaller --noconfirm --clean HammerCandleBacktestDashboard.spec

      - name: Restore stub into dist/
        shell: pwsh
        run: |
          Copy-Item "dist/_stash/HammerCandleBacktestDashboard.exe" "dist/HammerCandleBacktestDashboard.exe" -Force
          if (-not (Test-Path "dist/HammerRuntime.exe")) { throw "Runtime build missing" }
          if (-not (Test-Path "dist/_stash/stub_embedded.ok")) {
            throw "Runtime build did not embed stub (missing dist/_stash/stub_embedded.ok) - one-hop migration would fail for old clients"
          }
          Write-Host "Stub embed marker OK"

      - name: Assemble stub package + zip
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/ci_package_stub_windows.ps1

      - name: Smoke-test stub package (boot log)
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/ci_smoke_stub_windows.ps1

      - name: Upload package to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release-assets/Hammer-stub-package.zip
            dist/release-assets/HammerRuntime.exe
            dist/release-assets/HammerCandleBacktestDashboard.exe
          fail_on_unmatched_files: true
          generate_release_notes: false
