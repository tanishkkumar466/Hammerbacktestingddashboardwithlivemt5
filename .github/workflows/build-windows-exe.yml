name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "main.py"
      - "dashboard.py"
      - "logic.py"
      - "doji_logic.py"
      - "backtest.py"
      - "plotting.py"
      - "hammer_context_logic.py"
      - "broker.py"
      - "live.py"
      - "live_journal.py"
      - "fetch.py"
      - "indicators/**"
      - "pyinstaller/**"
      - "requirements.txt"
      - "requirements-build.txt"
      - "HammerCandleBacktestDashboard.spec"
      - "HammerStub.spec"
      - "update/**"
      - "scripts/ci_package_stub_windows.ps1"
      - "scripts/ci_smoke_stub_windows.ps1"
      - "scripts/check_update_pipeline.py"
      - "logo.ico"
      - "app_icon.ico"
      - ".github/workflows/build-windows-exe.yml"

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip uninstall -y polars polars-lts-cpu 2>nul || true
          pip install -r requirements-build.txt
          pip uninstall -y polars 2>nul || true
          pip show polars-lts-cpu
          pip install pytest

      - name: Assert PyInstaller matches known-good local (6.19.0)
        shell: pwsh
        run: |
          python -c "import PyInstaller; v=PyInstaller.__version__; print('PyInstaller', v); assert v=='6.19.0', f'expected 6.19.0 got {v}'"

      - name: Verify Python syntax
        run: python scripts/verify_syntax.py

      - name: Pipeline sanity (stub package / asset pick / no Qt in stub)
        run: python scripts/check_update_pipeline.py

      - name: Unit tests (updater + paths)
        run: python -m pytest tests/test_updater.py tests/test_logs_layout.py -q --tb=short

      - name: Verify runtime imports
        shell: pwsh
        run: |
          python -c "import sqlite3, _sqlite3, ssl, PySide6, shiboken6, polars, pyarrow, numpy, matplotlib; import matplotlib.backends.backend_qtagg, matplotlib.backends.backend_qt; import openpyxl, et_xmlfile, defusedxml, tzdata, psutil, ray, MetaTrader5; import aiohttp, pydantic, pydantic_core, virtualenv, watchfiles, colorful, ray._private.object_ref_generator; import update, update.paths, update.stub, update.migrate, update.updater; print('imports OK', update.updater.CURRENT_VERSION)"
          python -c "import importlib.metadata as m; names=[d.metadata['Name'].lower() for d in m.distributions()]; print([n for n in names if 'polars' in n]); assert any(n=='polars-lts-cpu' or n.startswith('polars-lts') for n in names), 'need polars-lts-cpu installed'"

      - name: Build stub launcher (HammerCandleBacktestDashboard.exe)
        run: pyinstaller --noconfirm --clean HammerStub.spec

      - name: Stash stub aside
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/HammerCandleBacktestDashboard.exe")) { throw "Stub build missing" }
          New-Item -ItemType Directory -Force -Path "dist/_stash" | Out-Null
          Copy-Item "dist/HammerCandleBacktestDashboard.exe" "dist/_stash/HammerCandleBacktestDashboard.exe" -Force
          $sz = (Get-Item "dist/_stash/HammerCandleBacktestDashboard.exe").Length
          if ($sz -ge 80MB) { throw "Stashed stub is too large - wrong binary" }

      - name: Build runtime (HammerRuntime.exe)
        run: pyinstaller --noconfirm --clean HammerCandleBacktestDashboard.spec

      - name: Restore stub into dist/
        shell: pwsh
        run: |
          Copy-Item "dist/_stash/HammerCandleBacktestDashboard.exe" "dist/HammerCandleBacktestDashboard.exe" -Force
          if (-not (Test-Path "dist/HammerRuntime.exe")) { throw "Runtime build missing" }
          if (-not (Test-Path "dist/_stash/stub_embedded.ok")) {
            throw "Runtime build did not embed stub (missing dist/_stash/stub_embedded.ok) - one-hop migration would fail for old clients"
          }
          Write-Host "Stub embed marker OK"

      - name: Assemble stub package + zip
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/ci_package_stub_windows.ps1

      - name: Smoke-test stub package (boot log)
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/ci_smoke_stub_windows.ps1

      - name: Upload artifact (stub package zip)
        uses: actions/upload-artifact@v4
        with:
          name: Hammer-stub-package-zip
          path: dist/Hammer-stub-package.zip
          if-no-files-found: error

      - name: Upload artifact (runtime exe)
        uses: actions/upload-artifact@v4
        with:
          name: HammerRuntime.exe
          path: dist/HammerRuntime.exe
          if-no-files-found: error

      - name: Upload artifact (stub exe)
        uses: actions/upload-artifact@v4
        with:
          name: HammerCandleBacktestDashboard-stub.exe
          path: dist/HammerCandleBacktestDashboard.exe
          if-no-files-found: error
