name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "main.py"
      - "dashboard.py"
      - "logic.py"
      - "doji_logic.py"
      - "backtest.py"
      - "plotting.py"
      - "hammer_context_logic.py"
      - "broker.py"
      - "live.py"
      - "live_journal.py"
      - "fetch.py"
      - "indicators/**"
      - "pyinstaller/**"
      - "requirements.txt"
      - "requirements-build.txt"
      - "HammerCandleBacktestDashboard.spec"
      - "logo.ico"
      - "app_icon.ico"
      - ".github/workflows/build-windows-exe.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip uninstall -y polars polars-lts-cpu 2>nul || true
          pip install -r requirements-build.txt
          pip uninstall -y polars 2>nul || true
          pip show polars-lts-cpu

      - name: Assert PyInstaller matches known-good local (6.19.0)
        shell: pwsh
        run: |
          python -c "import PyInstaller; v=PyInstaller.__version__; print('PyInstaller', v); assert v=='6.19.0', f'expected 6.19.0 got {v}'"

      - name: Verify Python syntax
        run: python scripts/verify_syntax.py

      - name: Verify runtime imports
        shell: pwsh
        run: |
          python -c "import sqlite3, _sqlite3, ssl, PySide6, shiboken6, polars, pyarrow, numpy, matplotlib; import matplotlib.backends.backend_qtagg, matplotlib.backends.backend_qt; import openpyxl, et_xmlfile, defusedxml, tzdata, psutil, ray, MetaTrader5; import aiohttp, pydantic, pydantic_core, virtualenv, watchfiles, colorful, ray._private.object_ref_generator; print('imports OK')"
          python -c "import importlib.metadata as m; names=[d.metadata['Name'].lower() for d in m.distributions()]; print([n for n in names if 'polars' in n]); assert any(n=='polars-lts-cpu' or n.startswith('polars-lts') for n in names), 'need polars-lts-cpu installed'"

      - name: Build one-file executable
        run: pyinstaller --noconfirm --clean HammerCandleBacktestDashboard.spec

      - name: Verify EXE size
        shell: pwsh
        run: |
          $exe = "dist/HammerCandleBacktestDashboard.exe"
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          $size = (Get-Item $exe).Length
          $mb = [math]::Round($size / 1MB, 1)
          Write-Host "Built $exe ($mb MB)"
          if ($size -lt 400MB) { throw "EXE too small ($mb MB) — expected ~420-450 MB" }
          if ($size -lt 420MB) { Write-Warning "EXE is $mb MB (target ~430 MB)" }

      - name: Smoke-test EXE starts (boot log)
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP "hammer_smoke"
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Copy-Item "dist/HammerCandleBacktestDashboard.exe" $work
          Unblock-File -LiteralPath (Join-Path $work "HammerCandleBacktestDashboard.exe") -ErrorAction SilentlyContinue
          Push-Location $work
          $sys32 = Join-Path $env:SystemRoot "System32"
          $env:PATH = "$sys32;$env:SystemRoot"
          Remove-Item Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          $proc = Start-Process -FilePath ".\HammerCandleBacktestDashboard.exe" -PassThru -WindowStyle Normal
          $deadline = (Get-Date).AddSeconds(90)
          $boot = ""
          $crash = ""
          while ((Get-Date) -lt $deadline) {
            if (Test-Path "hammer_boot.log") { $boot = Get-Content "hammer_boot.log" -Raw -ErrorAction SilentlyContinue }
            if (Test-Path "hammer_crash.log") { $crash = Get-Content "hammer_crash.log" -Raw -ErrorAction SilentlyContinue }
            if ($boot -match "QApplication OK") { break }
            if ($crash -and $crash.Trim().Length -gt 0) { break }
            if ($proc.HasExited -and $proc.ExitCode -ne 0) { break }
            Start-Sleep -Seconds 2
          }
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          if (Test-Path "hammer_boot.log") { $boot = Get-Content "hammer_boot.log" -Raw }
          if (Test-Path "hammer_crash.log") { $crash = Get-Content "hammer_crash.log" -Raw }
          Write-Host "==== hammer_boot.log ===="
          if ($boot) { Write-Host $boot } else { Write-Host "(missing)" }
          Write-Host "==== hammer_crash.log ===="
          if ($crash) { Write-Host $crash } else { Write-Host "(none)" }
          Pop-Location
          if ($crash -and $crash.Trim().Length -gt 0) { throw "EXE wrote hammer_crash.log:`n$crash" }
          if (-not $boot) { throw "EXE never wrote hammer_boot.log — bootloader died before Python (DLL/OpenSSL)." }
          if ($boot -notmatch "QApplication OK") {
            throw "hammer_boot.log missing QApplication OK:`n$boot"
          }
          Write-Host "Smoke OK (minimal PATH, qwindows)"

      - name: Package delivery zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/HammerCandleBacktestDashboard" | Out-Null
          Copy-Item "dist/HammerCandleBacktestDashboard.exe" "dist/HammerCandleBacktestDashboard/"
          @"
          Hammer Candle Backtest Dashboard (Windows)

          1. Put HammerCandleBacktestDashboard.exe next to your data/ folder.
          2. Double-click the exe (NOT the small Hammer-x.y.z.zip source file on GitHub).
          3. Real exe size is about 150-450 MB.

          Self-update: Help -> Check for Updates (downloads HammerCandleBacktestDashboard.exe).
          "@ | Set-Content -Encoding UTF8 "dist/HammerCandleBacktestDashboard/README.txt"
          Compress-Archive -Path "dist/HammerCandleBacktestDashboard/*" -DestinationPath "dist/HammerCandleBacktestDashboard-windows.zip" -Force

      - name: Upload artifact (exe)
        uses: actions/upload-artifact@v4
        with:
          name: HammerCandleBacktestDashboard.exe
          path: dist/HammerCandleBacktestDashboard.exe
          if-no-files-found: error

      - name: Upload artifact (delivery zip)
        uses: actions/upload-artifact@v4
        with:
          name: HammerCandleBacktestDashboard-windows-zip
          path: dist/HammerCandleBacktestDashboard-windows.zip
          if-no-files-found: error
