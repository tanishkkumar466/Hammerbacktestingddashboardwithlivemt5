name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "main.py"
      - "dashboard.py"
      - "logic.py"
      - "doji_logic.py"
      - "backtest.py"
      - "plotting.py"
      - "hammer_context_logic.py"
      - "broker.py"
      - "live.py"
      - "live_journal.py"
      - "fetch.py"
      - "indicators/**"
      - "requirements.txt"
      - "requirements-build.txt"
      - "HammerCandleBacktestDashboard.spec"
      - "logo.ico"
      - "app_icon.ico"
      - ".github/workflows/build-windows-exe.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install build dependencies
        run: pip install -r requirements-build.txt

      - name: Verify source tree
        shell: pwsh
        run: |
          $required = @(
            "main.py", "dashboard.py", "logic.py", "doji_logic.py", "backtest.py",
            "plotting.py", "broker.py", "live.py", "live_journal.py",
            "hammer_context_logic.py",
            "HammerCandleBacktestDashboard.spec"
          )
          foreach ($f in $required) {
            if (-not (Test-Path $f)) { throw "Missing required file: $f" }
          }
          if (-not (Test-Path "indicators/__init__.py")) { throw "Missing indicators package" }
          if (Test-Path "logo.ico") {
            Write-Host "Using logo.ico for exe + window icon"
          } elseif (Test-Path "app_icon.ico") {
            Write-Host "logo.ico not found — using app_icon.ico"
          } else {
            Write-Host "No .ico in repo — build will use default PyInstaller icon"
          }

      - name: Build executable (PyInstaller spec)
        run: pyinstaller --noconfirm --clean HammerCandleBacktestDashboard.spec

      - name: Smoke-check EXE
        shell: pwsh
        run: |
          $exe = "dist/HammerCandleBacktestDashboard/HammerCandleBacktestDashboard.exe"
          if (-not (Test-Path $exe)) { throw "Build did not produce $exe" }
          $size = (Get-Item $exe).Length
          if ($size -lt 1MB) { throw "EXE suspiciously small ($size bytes) — likely incomplete bundle" }
          Write-Host "Built $exe ($([math]::Round($size/1MB, 1)) MB)"

      - name: Package delivery folder
        shell: pwsh
        run: |
          $folder = "dist/HammerCandleBacktestDashboard"
          @"
          Hammer Candle Backtest Dashboard (Windows)

          1. Copy the whole HammerCandleBacktestDashboard folder next to your data/ folder.
          2. Double-click HammerCandleBacktestDashboard.exe inside that folder.
          3. If SmartScreen appears: More info -> Run anyway (unsigned app).

          Live MT5: Windows only — install MetaTrader 5 terminal.
          Self-update: attach HammerCandleBacktestDashboard-windows.zip to GitHub Releases.
          "@ | Set-Content -Encoding UTF8 "$folder/README.txt"
          Compress-Archive -Path "$folder/*" -DestinationPath "dist/HammerCandleBacktestDashboard-windows.zip" -Force

      - name: Upload artifact (onedir folder)
        uses: actions/upload-artifact@v4
        with:
          name: HammerCandleBacktestDashboard-windows
          path: dist/HammerCandleBacktestDashboard/
          if-no-files-found: error

      - name: Upload artifact (windows zip for releases)
        uses: actions/upload-artifact@v4
        with:
          name: HammerCandleBacktestDashboard-windows-zip
          path: dist/HammerCandleBacktestDashboard-windows.zip
          if-no-files-found: error
